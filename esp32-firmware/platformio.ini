; Project Qwen - ESP32 firmware (ESP32-WROOM-32 dev board)
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor   (type protocol commands to test, see README.md)

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
build_flags = -Wall
monitor_speed = 115200
monitor_echo = yes
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Perfboard pin test (LED pins HIGH, motor pins LOW). Not the robot firmware.
;   pio run -e pintest -t upload      then back to normal: pio run -e esp32dev -t upload
[env:pintest]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
build_src_filter = -<*> +<../pintest/>
monitor_speed = 115200
upload_speed = 921600
