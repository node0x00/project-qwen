#odo .fw { fill: #e2b04e; }
#odo .ang { fill: none; stroke: #e2b04e; stroke-width: 2.5; }
#odo .ctr { fill: #e2b04e; }</style><rect width="100%" height="100%" fill="#0f1417"/>
      <title id="odo-t">Odometry: 60 counts per wheel turn, 162 mm wheel, 509 mm per turn, 8.5 mm per count; turning angle equals the difference between the wheel distances divided by the wheel spacing</title>
      <text x="48" y="72" class="o-h1">Project Qwen <tspan class="o-acc">· Odometry</tspan></text>
      <text x="1552" y="62" class="o-meta" text-anchor="end">counting wheel turns to know</text>
      <text x="1552" y="80" class="o-meta" text-anchor="end">how far it moved and turned</text>
      <line x1="48" y1="98" x2="1552" y2="98" class="o-rule"></line>

      <circle cx="62" cy="139" r="18" fill="#6cc3a0"></circle><text x="62" y="148" class="o-step" text-anchor="middle">1</text>
      <text x="92" y="148" class="o-h2">How far: one wheel turn = 60 counts</text>
      <circle cx="250" cy="352" r="125" class="tire"></circle>
      <circle cx="250" cy="352" r="112" class="rim"></circle>
      <line class="tk-on" x1="250.0" y1="262.0" x2="250.0" y2="236.0"></line><line class="tk" x1="260.2" y1="254.5" x2="261.9" y2="238.6"></line><line class="tk" x1="270.4" y1="256.1" x2="273.7" y2="240.5"></line><line class="tk" x1="280.3" y1="258.8" x2="285.2" y2="243.6"></line><line class="tk" x1="289.9" y1="262.5" x2="296.4" y2="247.9"></line><line class="tk" x1="299.0" y1="267.1" x2="307.0" y2="253.3"></line><line class="tk" x1="307.6" y1="272.7" x2="317.0" y2="259.8"></line><line class="tk" x1="315.6" y1="279.2" x2="326.3" y2="267.3"></line><line class="tk" x1="322.8" y1="286.4" x2="334.7" y2="275.7"></line><line class="tk" x1="329.3" y1="294.4" x2="342.2" y2="285.0"></line><line class="tk" x1="334.9" y1="303.0" x2="348.7" y2="295.0"></line><line class="tk" x1="339.5" y1="312.1" x2="354.1" y2="305.6"></line><line class="tk" x1="343.2" y1="321.7" x2="358.4" y2="316.8"></line><line class="tk" x1="345.9" y1="331.6" x2="361.5" y2="328.3"></line><line class="tk" x1="347.5" y1="341.8" x2="363.4" y2="340.1"></line><line class="tk" x1="348.0" y1="352.0" x2="364.0" y2="352.0"></line><line class="tk" x1="347.5" y1="362.2" x2="363.4" y2="363.9"></line><line class="tk" x1="345.9" y1="372.4" x2="361.5" y2="375.7"></line><line class="tk" x1="343.2" y1="382.3" x2="358.4" y2="387.2"></line><line class="tk" x1="339.5" y1="391.9" x2="354.1" y2="398.4"></line><line class="tk" x1="334.9" y1="401.0" x2="348.7" y2="409.0"></line><line class="tk" x1="329.3" y1="409.6" x2="342.2" y2="419.0"></line><line class="tk" x1="322.8" y1="417.6" x2="334.7" y2="428.3"></line><line class="tk" x1="315.6" y1="424.8" x2="326.3" y2="436.7"></line><line class="tk" x1="307.6" y1="431.3" x2="317.0" y2="444.2"></line><line class="tk" x1="299.0" y1="436.9" x2="307.0" y2="450.7"></line><line class="tk" x1="289.9" y1="441.5" x2="296.4" y2="456.1"></line><line class="tk" x1="280.3" y1="445.2" x2="285.2" y2="460.4"></line><line class="tk" x1="270.4" y1="447.9" x2="273.7" y2="463.5"></line><line class="tk" x1