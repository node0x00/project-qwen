<svg xmlns="http://www.w3.org/2000/svg" id="odo" viewBox="0 0 1600 900" role="img" aria-labelledby="odo-t"><style>@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap");
